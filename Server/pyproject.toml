[tool.poetry]
name = "vtuber-link-start"
version = "0.1.0"
description = "A Python-based VTuber face tracking and animation system"
authors = ["Your Name <you@example.com>"]
license = "MIT"
readme = "Readme.md"
packages = [{include = "service"}]

[tool.poetry.dependencies]
python = "^3.8"
tensorflow = ">=2.3"
